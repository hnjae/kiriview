version = 1
SPDX-PackageName = "KiriView"

[[annotations]]
path = [
  # Application:
  "app/**/org.hnjae.kiriview.svg",
  "app/Cargo.lock",
  "app/Cargo.toml",
  "app/cargo-sources.json",
  "app/org.hnjae.kiriview.desktop",
  "app/org.hnjae.kiriview.json",
  "app/po/**/*.po",
  "app/tests/fixtures/**/*",

  # Development environments:
  "**/justfile",
  "**/devenv.lock",
  "**/devenv.yaml",

  # Documentations:
  "**/*.md",

  # Tool configurations:
  "**/.gitignore",
  "**/.clang-tidy",
  ".clang-format",
  ".cmake-format.yaml",
  ".editorconfig",
  "biome.json",
  "cog.toml",
  "rumdl.toml",
  "statix.toml",
  "typos.toml",
  "yamlfmt.yaml",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 KIM Hyunjae"
SPDX-License-Identifier = "AGPL-3.0-or-later"
